{% assign media = site.data.profile.feature_media %}
{% if media.kind == 'image' and media.src %}
<figure class="feature-image {{ include.placement }}">
  {% if media.full_src %}<a href="{{ media.full_src | relative_url }}" aria-label="View photograph at full resolution">{% endif %}
  <img src="{{ media.src | relative_url }}"
    {% if media.variants %}srcset="{% for variant in media.variants %}{{ variant.src | relative_url }} {{ variant.width }}w{% unless forloop.last %}, {% endunless %}{% endfor %}"
    sizes="(max-width: 760px) calc(100vw - 46px), (max-width: 877px) 235px, (max-width: 1159px) calc((100vw - 149px) / 3.1), 327px"{% endif %}
    alt="{{ media.alt | escape }}" width="{{ media.width }}" height="{{ media.height }}" decoding="async">
  {% if media.full_src %}</a>{% endif %}
</figure>
{% endif %}
