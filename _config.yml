################################################################################

# NB! Tread carefully if you want to change the variables below this point!

# Sections shown in the index page

pages_list:
  About: 'about'
  Projects: 'latest-post'
  Timeline: 'timeline'
  Contact: 'contact'

# Exclusion list from the generated _site

exclude: ["LICENSE", "README.md", "CONTRIBUTING", "CONTRIBUTORS", "scripts", "AGENTS.md", "Gemfile", "Gemfile.lock", "vendor", "design-review", "css", "js"]

# Pagination path

paginate_path: "blog/page:num/"

# Enable minification SASS

sass:
  style: compressed

plugins:
  - jekyll-paginate
  - jemoji

# Selected homepage order and compact work history.
home_featured: [road-to-seed-round, lessons-mvp-launch, IROS]
home_roles:
  - name: Evotrux
    period: 2022–present
  - name: AGCO / 151 Research
    period: 2020–2022
  - name: Robotics & research
    period: 2018–2019
