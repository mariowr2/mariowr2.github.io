name: Build and check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: ./scripts/check
      - name: Ensure archive and article sources are committed
        run: |
          if [ -n "$(git status --porcelain -- categories tags text)" ]; then
            echo 'Run ./scripts/build and commit the generated categories/, tags/, and text/ pages.'
            git status --short -- categories tags text
            exit 1
          fi
